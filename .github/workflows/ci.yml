name: CI

on:
  push:
    branches: [main, development, feature-tests, feature-code, impl-fibonacci, impl-pin]
  pull_request:
    branches: [feature-code, development, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test